<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>任务加载中</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #f3f6fb 0%, #eef2f7 100%);
            color: #111827;
        }

        .bootstrap-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .bootstrap-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .bootstrap-spinner {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid #dbeafe;
            border-top-color: #1976d2;
            animation: rotate 1s linear infinite;
        }

        .bootstrap-title {
            font-size: 24px;
            font-weight: 700;
        }

        .bootstrap-status {
            margin-top: 12px;
            font-size: 15px;
            line-height: 1.7;
            color: #475569;
        }

        .bootstrap-error {
            margin-top: 16px;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .bootstrap-actions {
            display: none;
            margin-top: 24px;
            gap: 12px;
            flex-direction: column;
        }

        .bootstrap-actions.show {
            display: flex;
        }

        .bootstrap-btn {
            width: 100%;
            border: none;
            border-radius: 999px;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .bootstrap-btn.primary {
            background: #1976d2;
            color: #ffffff;
        }

        .bootstrap-btn.secondary {
            background: #eff6ff;
            color: #1976d2;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bootstrap-page">
        <div class="bootstrap-card">
            <div class="bootstrap-spinner" id="bootstrap-spinner"></div>
            <div class="bootstrap-title">正在加载任务</div>
            <div class="bootstrap-status" id="bootstrap-status">请稍候，系统正在初始化导航环境...</div>
            <div class="bootstrap-error" id="bootstrap-error"></div>
            <div class="bootstrap-actions" id="bootstrap-actions">
                <button class="bootstrap-btn primary" id="bootstrap-retry-btn" type="button">重新加载</button>
                <button class="bootstrap-btn secondary" id="bootstrap-login-btn" type="button">返回登录页</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script src="js/coordinate-convert.js"></script>
    <script src="js/scan-task-service.js"></script>
    <script src="js/scan-bootstrap.js"></script>
</body>
</html>
