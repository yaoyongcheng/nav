<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工地地图</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/task-card-shared.css">
    <!-- v1.6.16：离线队列弹窗共用样式 -->
    <link rel="stylesheet" href="css/location-queue-ui.css?v=v1618">
    <script src="js/amap-loader.js"></script>
    <style>
    #prohibit-alert-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        display: none;
    }

    .alert-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.6);
        background-color: rgba(255, 0, 0, 0.15);
        animation: pulseAlert 1.5s infinite;
    }

    .alert-banner {
        position: absolute;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        color: red;
        font-size: 16px;
        font-weight: bold;
        padding: 10px 20px;
        border-radius: 8px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
    }

    .icon-wrapper {
        width: 22px;
        height: 22px;
        background: #ff4d4f;
        border-radius: 50%;
        color: white;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 10px;
    }

    @keyframes pulseAlert {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
    }

    /* v1.6.11 新增：离线队列按钮 + badge */
    #location-queue-btn {
        position: relative;
    }
    .control-badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        background: #ff4d4f;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
        line-height: 1;
        pointer-events: none;
    }
    /* v1.6.16：离线队列弹窗样式抽出到 css/location-queue-ui.css 共用 */
    </style>
</head>
<!-- 隐藏的文件输入 -->
<input type="file" id="file-input" accept=".kml" style="display: none;">
<body>
    <div class="container">
        <div id="prohibit-alert-layer" style="display: none;">
            <div class="alert-overlay"></div>
            <div class="alert-banner">
                <div class="icon-wrapper">!</div> 注意！已进入禁行区域！
            </div>
        </div>

        <!-- 地图容器 -->
        <div id="map-container"></div>
        
        <!-- 搜索区域 -->
        <div class="search-container">
            <div class="search-box">
                <img src="images/工地数字导航小程序切图/司机/2X/导航/搜索.png" class="search-icon-img" alt="搜索">
                <input type="text" placeholder="输入文字搜索目的地" id="search-input" readonly>
            </div>
            <div class="search-results" id="search-results">
                <!-- 搜索结果将动态填充 -->
            </div>
        </div>
        
        <!-- 底部卡片 -->
        <div class="bottom-card" id="bottom-card">
            <!-- 地图控制按钮（相对卡片顶部定位，不被卡片遮挡） -->
            <div class="map-controls">
                <!-- 导入按钮（已隐藏） -->
                <button class="control-btn" id="import-btn" title="导入数据" style="display: none;">
                    <i class="fas fa-upload"></i>
                </button>
                <button class="control-btn" id="locate-btn" title="定位">
                    <img src="images/工地数字导航小程序切图/司机/2X/导航/定位.png" alt="定位" style="width: 24px; height: 24px;">
                </button>
                <!-- v1.6.11 新增：离线队列入口（紧挨定位按钮） -->
                <button class="control-btn" id="location-queue-btn" title="离线队列" aria-label="离线队列">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 20px;"></i>
                    <span class="control-badge" id="location-queue-badge" hidden>0</span>
                </button>
            </div>
            <!-- 路线规划界面 -->
            <div class="route-planning-section" id="route-planning-section">
                <div class="route-selector">
                    <div class="location-inputs-wrapper">
                        <div class="location-inputs">
                            <div class="location-item">
                                <i class="fas fa-circle start-icon"></i>
                                <input type="text" placeholder="我的位置" id="start-location" readonly>
                            </div>
                            <div class="divider-line">
                                <button class="swap-btn" id="swap-locations-btn" title="切换起点终点">
                                    <img src="images/工地数字导航小程序切图/司机/2X/导航/切换起点终点.png" alt="切换起点终点">
                                </button>
                            </div>
                            <div class="waypoints-container" id="waypoints-container">
                                <!-- 途经点将动态添加 -->
                            </div>
                            <div class="location-item">
                                <i class="fas fa-circle end-icon"></i>
                                <input type="text" placeholder="请输入目的地" id="end-location" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="add-waypoint">
                        <div class="add-btn" id="add-waypoint-btn">
                            <img src="images/工地数字导航小程序切图/司机/2X/导航/添加途径点.png" alt="添加途径点">
                        </div>
                        <div class="waypoint-label">途径点</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="scan-task-overlay" id="scan-task-overlay" aria-hidden="true">
            <div class="scan-task-overlay-backdrop"></div>
            <div class="scan-task-popup" role="dialog" aria-modal="true" aria-labelledby="scan-task-popup-title">
                <div class="scan-task-popup-title" id="scan-task-popup-title">当前任务</div>
                <div class="scan-task-popup-card" id="scan-task-popup-card"></div>
                <div class="scan-task-popup-actions">
                    <button class="scan-task-popup-btn primary" id="scan-task-list-btn" type="button">前往任务列表</button>
                    <button class="scan-task-popup-btn secondary" id="scan-task-close-btn" type="button">关闭</button>
                </div>
            </div>
        </div>


        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" data-page="index">
                <img class="nav-icon-img" src="images/工地数字导航小程序切图/司机/2X/菜单栏/导航-down.png" data-active="images/工地数字导航小程序切图/司机/2X/菜单栏/导航-down.png" data-inactive="images/工地数字导航小程序切图/司机/2X/菜单栏/导航-up.png" alt="导航">
                <div class="nav-text">导航</div>
            </div>
            <div class="nav-item" data-page="task">
                <img class="nav-icon-img" src="images/工地数字导航小程序切图/司机/2X/菜单栏/任务-up.png" data-active="images/工地数字导航小程序切图/司机/2X/菜单栏/任务-down.png" data-inactive="images/工地数字导航小程序切图/司机/2X/菜单栏/任务-up.png" alt="任务">
                <div class="nav-text">任务</div>
            </div>
            <div class="nav-item" data-page="profile">
                <img class="nav-icon-img" src="images/工地数字导航小程序切图/司机/2X/菜单栏/我的-up.png" data-active="images/工地数字导航小程序切图/司机/2X/菜单栏/我的-down.png" data-inactive="images/工地数字导航小程序切图/司机/2X/菜单栏/我的-up.png" alt="我的">
                <div class="nav-text">我的</div>
            </div>
        </div>
    </div>
    <!-- 在 index.html 中更新脚本引用 -->
    <script src="js/config.js"></script>
    <script src="js/coordinate-convert.js"></script>
    <script src="js/segment-splitter.js"></script>
    <script src="js/map-core.js"></script>
    <script src="js/point-name-utils.js"></script>
    <script src="js/map/base-map-renderer.js"></script>
    <script src="js/kml-handler.js"></script>
    <script src="js/search-service.js"></script>
    <script src="js/enhanced-highlight.js"></script>
    <script src="js/point-selection.js"></script>
    <script src="js/driver-road-status.js"></script>
    <script src="js/kml-route-planning.js"></script>
    <script src="js/route-planning.js"></script>
    <script src="js/browser-toolbar-detect.js"></script>
    <script src="js/ui-utils.js"></script>
    <script src="js/api-data-converter.js"></script>
    <script src="js/location-queue.js"></script>
    <script src="js/location-queue-ui.js"></script>
    <script src="js/vehicle-location-reporter.js"></script>
    <script src="js/task-card-renderer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
