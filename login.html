    <!-- ⚠️ 加载层硬超时兜底（2026-10-09 新增，勿删）
         背景：<body> 末尾的同步 <script src="外部CDN"> 若「挂起」（连不上但也不报错），
         HTML 解析会阻塞，login.js 永不执行 → DOMContentLoaded 不触发 →
         hideLoadingScreen() 不调用 → 首页永久卡在「加载中...」。
         已在 vivo（VivoBrowser）上实测复现，其他机型因网络/浏览器代理差异不一定触发。
         本脚本在 <head> 内联，不依赖任何外部资源；setTimeout 在解析被网络阻塞期间
         仍会正常触发（事件循环是空闲的）。
         readyState 判断确保：只有「解析确实没完成」时才兜底，
         因此不会干扰登录时 showLoadingScreen() 的正常显示。 -->
    <script>
    (function () {
      setTimeout(function () {
        try {
          if (document.readyState !== 'complete') {
            var el = document.getElementById('loading-screen');
            if (el) {
              el.classList.add('hidden');
              el.style.display = 'none';
              if (window.console && console.warn) {
                console.warn('[兜底] 页面解析未在 6 秒内完成，强制移出加载层。请检查外部 CDN 是否可达。');
              }
            }
          }
        } catch (e) { /* 兜底自身绝不抛错 */ }
      }, 6000);
    })();
    </script>

    <!-- JSEncrypt库 - RSA加密
         ⚠️ 2026-10-09：由 cdnjs 改本地 js/lib/jsencrypt.min.js。
         原同步 CDN 脚本在挂起时会阻塞 HTML 解析，是 vivo 卡「加载中」的根因。
         本地文件必定快速返回，不再构成阻塞风险。 -->
    <script src="js/lib/jsencrypt.min.js"></script>
    <!-- defer：不阻塞 HTML 解析。即使此脚本挂起，也不会推迟解析完成 -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js" defer></script>

    <script src="js/push-subscribe.js"></script>

    <!-- iOS PWA 角标：页面加载时恢复未读数到桌面图标 -->
    <script>
    (function () {
      // 页面加载完成后从 localStorage 恢复角标
      function restoreBadge() {
        try {
          if (window.IOSBadge && typeof IOSBadge.restore === 'function') {
            IOSBadge.restore();
          }
        } catch (_) {}
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', restoreBadge);
      } else {
        restoreBadge();
      }

      // 监听 messageUpdated 事件：管理员消息变化时同步角标
      window.addEventListener('messageUpdated', function () {
        try {
          if (window.IOSBadge && window.AdminMessageManager) {
            IOSBadge.setBadge(AdminMessageManager.getUnreadCount());
          }
        } catch (_) {}
      });
    })();
    </script>
